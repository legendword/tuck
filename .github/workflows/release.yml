name: Release

on:
  push:
    tags: ["v*"]

# The default token is read-only. Only the publish job, which runs no project
# or third-party code, is allowed to write.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config where build scripts could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Run tests
        run: cargo test

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin --bin tuck

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin --bin tuck

      - name: Create universal binary
        run: |
          lipo -create -output tuck-macos-universal \
            target/aarch64-apple-darwin/release/tuck \
            target/x86_64-apple-darwin/release/tuck

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build FFI library
        run: ./build-ffi.sh

      - name: Build macOS app
        run: |
          cd TuckApp
          xcodegen generate
          xcodebuild build -project TuckApp.xcodeproj -scheme TuckApp \
            -configuration Release -derivedDataPath build
          APP_PATH="build/Build/Products/Release/Tuck.app"
          test -d "$APP_PATH" || { echo "App not found at $APP_PATH"; exit 1; }

      - name: Create DMG
        run: |
          APP_PATH="TuckApp/build/Build/Products/Release/Tuck.app"
          DMG_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "Tuck" -srcfolder "$DMG_DIR" \
            -ov -format UDZO Tuck.dmg

      # `tuck update` and install.sh verify the binary against this file.
      - name: Generate checksums
        run: |
          shasum -a 256 tuck-macos-universal > tuck-macos-universal.sha256
          shasum -a 256 Tuck.dmg > Tuck.dmg.sha256
          cat tuck-macos-universal.sha256 Tuck.dmg.sha256

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            tuck-macos-universal
            tuck-macos-universal.sha256
            Tuck.dmg
            Tuck.dmg.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Verify checksums
        run: sha256sum -c tuck-macos-universal.sha256 Tuck.dmg.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            tuck-macos-universal \
            tuck-macos-universal.sha256 \
            Tuck.dmg \
            Tuck.dmg.sha256
